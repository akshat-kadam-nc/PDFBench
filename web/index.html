<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF Bench</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --fg:#e7e9ee; --mut:#9aa3b2;
    --accent:#5b9dff; --accent2:#3b7de0; --ok:#3fb950; --warn:#d29922; --drop:#1d2330;
    --input:#0e1219; --panel:#0e1219; --chip:#1c2431; --disabled:#2a2f3a;
    --tab-on:#1a2740; --tab-on-fg:#ffffff;
    --steps-bg:#12233d; --steps-line:#1e3a5c; --steps-fg:#7fc0ff;
    --ok-bg:#12261a; --ok-line:#1e3a26; --ok-fg:#c6f0d0;
    --err-bg:#2a1417; --err-line:#5c2126; --err-fg:#f3c2c6;
  }
  :root[data-theme="light"], :root.light{
    --bg:#f3f5f9; --card:#ffffff; --line:#e3e7ee; --fg:#1b1f27; --mut:#5c6675;
    --accent:#2f6fe0; --accent2:#2f6fe0; --ok:#1a7f37; --warn:#9a6700; --drop:#eef2f8;
    --input:#f6f8fc; --panel:#f7f9fc; --chip:#eef1f6; --disabled:#dfe3ea;
    --tab-on:#e6efff; --tab-on-fg:#1f5fd0;
    --steps-bg:#e6efff; --steps-line:#c5d8f7; --steps-fg:#1f5fd0;
    --ok-bg:#e8f6ec; --ok-line:#bfe4c8; --ok-fg:#1a7f37;
    --err-bg:#fdecec; --err-line:#f3c2c6; --err-fg:#b42332;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]):not(.dark){
      --bg:#f3f5f9; --card:#ffffff; --line:#e3e7ee; --fg:#1b1f27; --mut:#5c6675;
      --accent:#2f6fe0; --accent2:#2f6fe0; --ok:#1a7f37; --warn:#9a6700; --drop:#eef2f8;
      --input:#f6f8fc; --panel:#f7f9fc; --chip:#eef1f6; --disabled:#dfe3ea;
      --tab-on:#e6efff; --tab-on-fg:#1f5fd0;
      --steps-bg:#e6efff; --steps-line:#c5d8f7; --steps-fg:#1f5fd0;
      --ok-bg:#e8f6ec; --ok-line:#bfe4c8; --ok-fg:#1a7f37;
      --err-bg:#fdecec; --err-line:#f3c2c6; --err-fg:#b42332;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding:44px 20px 90px}
  .workspace{display:flex;gap:22px;align-items:flex-start;margin-top:18px}
  .workmain{flex:1 1 52%;min-width:0}
  .workaside{flex:1 1 48%;position:sticky;top:16px;align-self:flex-start}
  @media(max-width:900px){
    .workspace{flex-direction:column}
    .workaside{position:static;width:100%;flex-basis:auto}
  }
  h1{font-size:26px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--mut);margin:2px 0 0}
  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{width:44px;height:44px;flex:none;border-radius:11px;display:block}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;
    width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .iconbtn:hover{background:var(--tab-on);color:var(--tab-on-fg);border-color:var(--accent2)}
  .tabs{display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;
    cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--mut);
    font-weight:600;font-size:14px}
  .tab.on{color:var(--tab-on-fg);border-color:var(--accent2);background:var(--tab-on)}
  .tab.op input{width:15px;height:15px;margin:0;accent-color:var(--accent2);cursor:pointer}
  .tab.op.sel{border-color:var(--accent2)}
  .tabspacer{flex:1 1 auto}
  .tab.log{background:transparent;border-color:transparent;color:var(--mut)}
  .tab.log:hover{color:var(--fg)}
  .tab.log.on{background:var(--card);border-color:var(--line);color:var(--fg)}
  .ctl-title{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;margin:2px 0 -4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:42px 20px;text-align:center;
    cursor:pointer;transition:.15s;background:var(--drop)}
  .drop.hover{border-color:var(--accent);background:var(--tab-on)}
  .drop.busy{opacity:.7;cursor:progress}
  .drop h2{margin:0 0 6px;font-size:18px;font-weight:600}
  .drop p{margin:0;color:var(--mut);font-size:14px}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:18px 0 2px}
  .chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
  .chk input{width:17px;height:17px;accent-color:var(--accent2)}
  .opts{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0 2px}
  .opt{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
  select,input[type=number],input[type=text]{background:var(--input);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:120px}
  .hint{font-size:12px;color:var(--mut);margin-top:14px}
  .fade{opacity:.4;pointer-events:none}
  .result{margin-top:22px}
  .banner{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border:1px solid var(--ok-line);
    color:var(--ok-fg);border-radius:10px;padding:12px 14px;font-size:14px;flex-wrap:wrap}
  .banner.err{background:var(--err-bg);border-color:var(--err-line);color:var(--err-fg)}
  .big{font-size:15px;font-weight:700}
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600}
  td.num{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:var(--chip);color:var(--mut)}
  .tag.fb{background:#2a230f;color:var(--warn)}
  .tag.color{background:#182a3a;color:#7fc0ff}
  .tag.gray{background:#22262e;color:#b9c0cc}
  .btn{display:inline-block;margin-top:16px;background:var(--accent2);color:#fff;border:none;
    border-radius:9px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;
    text-decoration:none;line-height:1.2;white-space:nowrap;vertical-align:middle}
  .btn:hover{background:var(--accent)}
  .btn:disabled{background:var(--disabled);color:var(--mut);cursor:not-allowed}
  .spin{width:16px;height:16px;border:2px solid #ffffff40;border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:s .7s linear infinite;vertical-align:-3px}
  @keyframes s{to{transform:rotate(360deg)}}
  code{background:var(--input);padding:1px 6px;border-radius:5px}
  ul.files{list-style:none;padding:0;margin:14px 0 0}
  ul.files li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:6px;font-size:13px}
  ul.files li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.files li button{background:var(--input);border:1px solid var(--line);color:var(--mut);
    border-radius:6px;cursor:pointer;padding:3px 8px;font:inherit}
  .viewer{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line)}
  .viewer-title{font-size:13px;color:var(--mut);font-weight:600}
  .viewer-frame{width:100%;height:calc(100vh - 150px);min-height:520px;border:none;display:block;background:#fff}
  .viewer-empty{display:flex;align-items:center;justify-content:center;height:520px;
    color:var(--mut);font-size:14px}
  .docbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .docinfo{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
  .docname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
  .steps{font-size:12px;color:var(--steps-fg);background:var(--steps-bg);border:1px solid var(--steps-line);
    border-radius:20px;padding:2px 10px}
  .docactions{display:flex;gap:8px}
  .btn.ghost{margin-top:0;background:var(--card);color:var(--fg);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--tab-on);color:var(--tab-on-fg)}
  .chk.combo{margin:16px 0 2px}
  .orgbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
  .orgcount{font-size:13px;color:var(--mut);font-weight:600}
  .orgacts{display:flex;gap:8px;flex-wrap:wrap}
  .orgacts .btn{display:inline-flex;align-items:center;gap:6px}
  .pagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
  .pagecell{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;
    cursor:grab;transition:border-color .12s,box-shadow .12s;user-select:none}
  .pagecell:hover{border-color:var(--accent2)}
  .pagecell.sel{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
  .pagethumbwrap{height:180px;display:flex;align-items:center;justify-content:center;
    background:#fff;border-radius:6px;overflow:hidden}
  .pagethumb{max-width:100%;max-height:100%;transition:transform .15s;box-shadow:0 1px 4px #0003}
  .pagefoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .pagenum{font-size:13px;font-weight:600;color:var(--fg)}
  .pageacts{display:flex;gap:2px}
  .pageacts button{background:transparent;border:none;color:var(--mut);cursor:pointer;
    padding:4px;border-radius:6px;display:flex;align-items:center}
  .pageacts button:hover{background:var(--tab-on);color:var(--tab-on-fg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useCallback, useRef, useEffect} = React;
const MB = b => (b/1e6).toFixed(2)+" MB";
const fmtDate = iso => { try{ return new Date(iso).toLocaleString(); }catch(_){ return iso; } };

// Inline line-icons (inherit currentColor, so they theme automatically).
function Icon({name,size=16}){
  const paths={
    deskew:<><path d="M21 12a9 9 0 1 1-3.2-6.9"/><polyline points="21 3 21 9 15 9"/></>,
    compress:<><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></>,
    merge:<><path d="M7 3v4.5l5 4 5-4V3"/><line x1="12" y1="11.5" x2="12" y2="21"/></>,
    organize:<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
    rotL:<><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/></>,
    rotR:<><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></>,
    trash:<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>,
    history:<><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></>,
    sun:<><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></>,
    moon:<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flex:"none"}}>{paths[name]}</svg>;
}

function Logo(){
  return (
    <svg className="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="44" height="44" rx="11" fill="#2563eb"/>
      <g transform="rotate(9 24 25)">
        <rect x="15" y="11" width="20" height="27" rx="2.5" fill="#fff"/>
        <rect x="18.5" y="16" width="12" height="2" rx="1" fill="#94a3b8"/>
        <rect x="18.5" y="20" width="13.5" height="2" rx="1" fill="#94a3b8"/>
        <rect x="18.5" y="24" width="10" height="2" rx="1" fill="#94a3b8"/>
        <rect x="18.5" y="28" width="12.5" height="2" rx="1" fill="#94a3b8"/>
      </g>
      <path d="M31 30a7 7 0 1 1-2.2-5.1" fill="none" stroke="#facc15" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M29.5 21.5l.8 4.7 4-2z" fill="#facc15"/>
    </svg>
  );
}

function useTheme(){
  const [theme,setTheme]=useState(()=>{
    try{ const s=localStorage.getItem("pdfbench-theme"); if(s==="light"||s==="dark") return s; }catch(_){}
    try{ return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light":"dark"; }catch(_){ return "dark"; }
  });
  useEffect(()=>{
    document.documentElement.setAttribute("data-theme",theme);
    try{ localStorage.setItem("pdfbench-theme",theme); }catch(_){}
  },[theme]);
  return [theme,setTheme];
}

// Pull a useful message out of a failed response (handles empty statusText on
// HTTP/2, non-JSON error bodies from the proxy, and OOM/timeout cases).
async function errorFromResponse(res){
  let detail="";
  try{
    const ct=res.headers.get("content-type")||"";
    if(ct.includes("application/json")){ const j=await res.json(); detail=j.detail||JSON.stringify(j); }
    else { detail=(await res.text()||"").slice(0,300); }
  }catch(_){}
  const hints={502:"the server likely crashed or ran out of memory",
               503:"the server is starting up or overloaded (free tier wakes from sleep — retry in ~30s)",
               504:"processing took too long and timed out",
               413:"the file is too large",507:"the server ran out of memory"};
  const hint=hints[res.status];
  let msg=`HTTP ${res.status}`+(res.statusText?" "+res.statusText:"");
  if(detail) msg+=`: ${detail}`;
  else if(hint) msg+=` — ${hint}`;
  return new Error(msg);
}
function describeError(e){
  if(e instanceof TypeError) // fetch network failure
    return "Could not reach the server. It may be restarting (free tier wakes from sleep) or was killed mid-request — wait ~30s and retry.";
  return String(e.message||e||"Unknown error");
}

function Drop({busy, label, sub, accept, multiple, onFiles}){
  const [hover,setHover]=useState(false);
  const ref=useRef();
  return (
    <>
      <div className={"drop"+(hover?" hover":"")+(busy?" busy":"")}
        onClick={()=>!busy&&ref.current.click()}
        onDragOver={e=>{e.preventDefault();setHover(true);}}
        onDragLeave={()=>setHover(false)}
        onDrop={e=>{e.preventDefault();setHover(false);if(!busy)onFiles([...e.dataTransfer.files]);}}>
        {busy ? <h2><span className="spin"></span>&nbsp; Working…</h2>
              : <><h2>{label}</h2><p>{sub}</p></>}
      </div>
      <input ref={ref} type="file" accept={accept} multiple={multiple} style={{display:"none"}}
        onChange={e=>{onFiles([...e.target.files]); e.target.value="";}}/>
    </>
  );
}

// Manage an object URL for a File, revoking it when the file changes/unmounts.
function usePdfUrl(file){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    if(!file){setUrl(null);return;}
    const u=URL.createObjectURL(file);
    setUrl(u);
    return ()=>URL.revokeObjectURL(u);
  },[file]);
  return url;
}

// Persistent in-app PDF preview (WebView2/Edge PDF viewer) of the current
// working document. Lives in its own column so switching tabs never reloads it.
function PdfViewer({url}){
  return (
    <div className="viewer">
      <div className="viewer-bar"><span className="viewer-title">Preview</span></div>
      {url
        ? <iframe className="viewer-frame" src={url+"#toolbar=1&view=FitH"} title="PDF preview"></iframe>
        : <div className="viewer-empty">Load a PDF to preview it here.</div>}
    </div>
  );
}

// Reusable control blocks so a tool can show its own options and, in combo
// mode, another tool's options too.
function DeskewControls({mode,setMode,dir,setDir}){
  return (
    <div className="opts">
      <label className="opt">Deskew mode
        <select value={mode} onChange={e=>setMode(e.target.value)}>
          <option value="hybrid">Hybrid</option><option value="auto">Auto</option><option value="fixed">Fixed</option>
        </select></label>
      <label className="opt">Direction
        <select value={dir} onChange={e=>setDir(e.target.value)}>
          <option value="odd-neg">Odd −, Even +</option><option value="odd-pos">Odd +, Even −</option>
        </select></label>
    </div>
  );
}
function CompressControls({dpi,setDpi,qc,setQc,qg,setQg,colorMode,setColorMode}){
  return (
    <div className="opts">
      <label className="opt">Resolution (DPI)
        <input type="number" step="10" value={dpi} onChange={e=>setDpi(e.target.value)}/></label>
      <label className="opt">Color quality
        <input type="number" min="10" max="95" value={qc} onChange={e=>setQc(e.target.value)}/></label>
      <label className="opt">Gray quality
        <input type="number" min="10" max="95" value={qg} onChange={e=>setQg(e.target.value)}/></label>
      <label className="opt">Color handling
        <select value={colorMode} onChange={e=>setColorMode(e.target.value)}>
          <option value="force_color">Always color (keeps borders/design)</option>
          <option value="auto">Auto (text→gray, figures→color)</option>
          <option value="force_gray">Always grayscale</option>
        </select></label>
    </div>
  );
}

// The current working document: name, applied-steps breadcrumb, download, and
// "load new". Shown once a file is loaded, in place of the drop zone.
function DocBar({doc, onDownload, onClear, busy}){
  return (
    <div className="docbar">
      <div className="docinfo">
        <span className="docname" title={doc.baseName+".pdf"}>📄 {doc.baseName}.pdf</span>
        {doc.steps.length>0 && <span className="steps">{doc.steps.join(" → ")}</span>}
      </div>
      <div className="docactions">
        <button className="btn ghost" onClick={onDownload} disabled={busy}>Download</button>
        <button className="btn ghost" onClick={onClear} disabled={busy}>Load new</button>
      </div>
    </div>
  );
}

// A pipeline-operation tab: a checkbox (include in the run) + label (view its
// options). The checkbox is the single source of truth for what runs, so the
// tab bar is a one-glance view of the selected pipeline. New single-file tools
// (encrypt, sign, …) are added as more OpTabs.
function OpTab({id,label,icon,active,checked,onView,onToggle}){
  return (
    <div className={"tab op"+(active?" on":"")+(checked?" sel":"")} onClick={()=>onView(id)}>
      <input type="checkbox" checked={checked}
        onClick={e=>e.stopPropagation()} onChange={()=>onToggle(id)}/>
      <Icon name={icon}/><span>{label}</span>
    </div>
  );
}
// A plain navigation tab (Merge, History) — not part of the single-file pipeline.
function NavTab({id,label,icon,active,onView,variant}){
  return (
    <div className={"tab"+(variant?" "+variant:"")+(active?" on":"")} onClick={()=>onView(id)}>
      <Icon name={icon}/><span>{label}</span>
    </div>
  );
}

// The single-file workspace: shows the viewed operation's controls and one Run
// button that applies every selected operation (ticked in the tab bar), in
// order, to the working document.
function OpPane({view, ops, doc, busy, err, report, onPick, onRun, download, clear,
                 mode,setMode,dir,setDir, dpi,setDpi,qc,setQc,qg,setQg,colorMode,setColorMode}){
  const selected=[]; if(ops.deskew)selected.push("Deskew"); if(ops.compress)selected.push("Compress");
  const runLabel = busy ? "Working…" : selected.length ? ("Run "+selected.join(" + ")) : "Run";
  return (
    <div className="card">
      {!doc
        ? <Drop busy={busy} label="Drag & drop a PDF" sub="or click to choose a file"
            accept="application/pdf" multiple={false} onFiles={onPick}/>
        : <DocBar doc={doc} onDownload={download} onClear={clear} busy={busy}/>}

      {doc && <>
        <div className="ctl-title">{view==="deskew"?"Deskew options":"Compress options"}</div>
        {view==="deskew"
          ? <DeskewControls mode={mode} setMode={setMode} dir={dir} setDir={setDir}/>
          : <CompressControls dpi={dpi} setDpi={setDpi} qc={qc} setQc={setQc}
              qg={qg} setQg={setQg} colorMode={colorMode} setColorMode={setColorMode}/>}

        <div className="hint">Tick the tabs above for every operation you want, then Run — they apply in order to the working file and replace it, with no re-upload.</div>
        <button className="btn" onClick={onRun} disabled={busy||!doc||selected.length===0}>{runLabel}</button>

        {err && <div className="result"><div className="banner err">⚠ {err}</div></div>}
        {report && <ProcessResult report={report}/>}
      </>}
    </div>
  );
}

function ProcessResult({report}){
  const ds=report.deskew, cp=report.compress;
  const pct=report.in_bytes?Math.round(report.out_bytes/report.in_bytes*100):100;
  return (
    <div className="result">
      <div className="banner">
        <span className="big">✓ {MB(report.in_bytes)} → {MB(report.out_bytes)} ({pct}%)</span>
        {cp && <>&nbsp;· {cp.color_pages} color / {cp.gray_pages} gray pages</>}
        <span style={{marginLeft:"auto",color:"var(--mut)"}}>applied: {(report.steps||[]).join(" + ")}</span>
      </div>
      {(ds||cp) &&
        <table>
          <thead><tr><th>Page</th>{ds&&<><th>Measured</th><th>Applied</th><th>Deskew</th></>}{cp&&<th>Color</th>}</tr></thead>
          <tbody>
            {(ds?ds.pages:cp.pages).map((p,i)=>{
              const c=cp?cp.pages[i]:null;
              return <tr key={p.page}>
                <td className="num">{p.page}</td>
                {ds&&<><td className="num">{p.measured===null?"—":p.measured.toFixed(2)+"°"}</td>
                  <td className="num">{p.applied>=0?"+":""}{p.applied.toFixed(2)}°</td>
                  <td><span className={"tag"+(p.reason.startsWith("fallback")?" fb":"")}>{p.reason}</span></td></>}
                {cp&&<td><span className={"tag "+(c.mode)}>{c.mode}</span></td>}
              </tr>;
            })}
          </tbody>
        </table>}
    </div>
  );
}

function MergeTab({onResult}){
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const [items,setItems]=useState([]); // {file}
  const [name,setName]=useState("book");
  const [result,setResult]=useState(null);

  const add=useCallback(fs=>{
    const pdfs=fs.filter(f=>f.name.toLowerCase().endsWith(".pdf"));
    setItems(prev=>{
      const all=[...prev,...pdfs.map(f=>({file:f}))];
      all.sort((a,b)=>a.file.name.localeCompare(b.file.name,undefined,{numeric:true}));
      return all;
    });
    setResult(null);
  },[]);
  const move=(i,d)=>setItems(p=>{const a=[...p];const j=i+d;if(j<0||j>=a.length)return a;[a[i],a[j]]=[a[j],a[i]];return a;});
  const remove=i=>setItems(p=>p.filter((_,x)=>x!==i));

  const doMerge=useCallback(async()=>{
    setErr(null);setResult(null);
    if(items.length<2){setErr("Add at least two PDFs.");return;}
    setBusy(true);
    try{
      const fd=new FormData();
      items.forEach(it=>fd.append("files",it.file));
      fd.append("name",name||"book");
      const res=await fetch("/api/merge",{method:"POST",body:fd});
      if(!res.ok) throw await errorFromResponse(res);
      const report=JSON.parse(res.headers.get("X-Report")||"{}");
      const blob=await res.blob();const url=URL.createObjectURL(blob);
      const filename=(name||"book")+".pdf";
      setResult({report,url,filename});
      onResult(blob, (name||"book"), ["merged"]);   // becomes the working doc
    }catch(e){setErr(describeError(e));}
    finally{setBusy(false);}
  },[items,name,onResult]);

  const totalIn=items.reduce((s,it)=>s+it.file.size,0);
  return (
    <div className="card">
      <Drop busy={busy} label="Drop chapter PDFs to merge" sub="add as many as you like — sorted by filename"
        accept="application/pdf" multiple={true} onFiles={add}/>
      {items.length>0 &&
        <ul className="files">
          {items.map((it,i)=>(
            <li key={i}>
              <span className="nm">{i+1}. {it.file.name}</span>
              <span className="num" style={{color:"var(--mut)"}}>{MB(it.file.size)}</span>
              <button onClick={()=>move(i,-1)} disabled={i===0}>↑</button>
              <button onClick={()=>move(i,1)} disabled={i===items.length-1}>↓</button>
              <button onClick={()=>remove(i)}>✕</button>
            </li>
          ))}
        </ul>}
      {items.length>0 &&
        <div className="opts" style={{marginTop:14}}>
          <label className="opt">Output name
            <input type="text" value={name} onChange={e=>setName(e.target.value)}/></label>
          <div className="opt">Combined input<span style={{color:"var(--fg)",fontWeight:600}}>{MB(totalIn)} · {items.length} files</span></div>
        </div>}
      <button className="btn" onClick={doMerge} disabled={busy||items.length<2}>
        {busy?"Merging…":"Merge into one PDF"}</button>
      <div className="hint">Merging is lossless. The merged file becomes your working document — switch to Deskew or Compress to keep editing it without re-uploading.</div>
      {err && <div className="result"><div className="banner err">⚠ {err}</div></div>}
      {result &&
        <div className="result"><div className="banner">
          <span className="big">✓ {result.report.total_pages} pages · {MB(result.report.out_bytes)}</span>
          &nbsp;· saved <code>{result.filename}</code>
          {result.report.out_bytes<10e6
            ? <span className="tag color" style={{marginLeft:8}}>under 10 MB</span>
            : <span className="tag fb" style={{marginLeft:8}}>over 10 MB</span>}
          <a className="btn" href={result.url} download={result.filename} style={{marginLeft:"auto"}}>Download again</a>
        </div></div>}
    </div>
  );
}

function HistoryTab(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  const [loading,setLoading]=useState(true);

  const load=useCallback(async()=>{
    setLoading(true);setErr(null);
    try{
      const res=await fetch("/api/history?limit=500");
      if(!res.ok) throw await errorFromResponse(res);
      setData(await res.json());
    }catch(e){setErr(describeError(e));}
    finally{setLoading(false);}
  },[]);
  useEffect(()=>{load();},[load]);

  const clear=useCallback(async()=>{
    if(!confirm("Clear the entire usage log? This cannot be undone.")) return;
    try{ await fetch("/api/history",{method:"DELETE"}); load(); }
    catch(e){setErr(describeError(e));}
  },[load]);

  const s=data&&data.stats;
  return (
    <div className="card">
      <div className="row" style={{marginTop:0,justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          <div className="opt">Files processed<span style={{color:"var(--fg)",fontWeight:700,fontSize:18}}>{s?s.count:"—"}</span></div>
          <div className="opt">Input total<span style={{color:"var(--fg)",fontWeight:700,fontSize:18}}>{s?MB(s.in_bytes):"—"}</span></div>
          <div className="opt">Output total<span style={{color:"var(--fg)",fontWeight:700,fontSize:18}}>{s?MB(s.out_bytes):"—"}</span></div>
          <div className="opt">Space saved<span style={{color:"var(--ok)",fontWeight:700,fontSize:18}}>{s?MB(s.saved_bytes):"—"}</span></div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button className="btn ghost" style={{marginTop:0}} onClick={load}>Refresh</button>
          <button className="btn" style={{marginTop:0,background:"var(--err-bg)",color:"var(--err-fg)",border:"1px solid var(--err-line)"}} onClick={clear} disabled={!s||!s.count}>Clear log</button>
        </div>
      </div>

      {err && <div className="result"><div className="banner err">⚠ {err}</div></div>}
      {loading && !data && <div className="hint">Loading…</div>}
      {data && data.items.length===0 && !loading &&
        <div className="hint" style={{marginTop:20}}>No files processed yet. Deskew, compress or merge a PDF and it will show up here.</div>}

      {data && data.items.length>0 &&
        <table>
          <thead><tr><th>When</th><th>Type</th><th>File</th><th className="num">Pages</th><th className="num">Size</th><th className="num">Saved</th></tr></thead>
          <tbody>
            {data.items.map(it=>{
              const pct=it.in_bytes?Math.round(it.out_bytes/it.in_bytes*100):100;
              const saved=(it.in_bytes||0)-(it.out_bytes||0);
              const label=it.op==="merge"?("merge ("+(it.inputs?it.inputs.length:0)+")"):(it.steps?it.steps.join("+"):"process");
              return <tr key={it.id}>
                <td style={{whiteSpace:"nowrap",color:"var(--mut)"}}>{fmtDate(it.at)}</td>
                <td><span className={"tag"+(it.op==="merge"?" color":"")}>{label}</span></td>
                <td style={{maxWidth:260,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={(it.inputs||[]).join(", ")}>{it.name}</td>
                <td className="num">{it.pages??"—"}</td>
                <td className="num">{MB(it.in_bytes||0)} → {MB(it.out_bytes||0)} <span style={{color:"var(--mut)"}}>({pct}%)</span></td>
                <td className="num" style={{color:saved>0?"var(--ok)":"var(--mut)"}}>{saved>0?MB(saved):"—"}</td>
              </tr>;
            })}
          </tbody>
        </table>}
      {data && <div className="hint" style={{marginTop:14}}>Stored locally at <code>{data.dir}</code> · newest first, up to 500 shown.</div>}
    </div>
  );
}

// Organize pages: thumbnail grid with drag-to-reorder, per-page rotate/delete,
// and bulk actions. Applies losslessly (pypdf) and replaces the working doc.
function OrganizeTab({doc, pick, applyResult, download, clear}){
  const [pages,setPages]=useState(null);   // [{id, orig, rot}]
  const [thumbs,setThumbs]=useState({});    // orig index -> data URL
  const [sel,setSel]=useState(()=>new Set());
  const [loading,setLoading]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const dragId=useRef(null);

  useEffect(()=>{
    if(!doc){ setPages(null); setThumbs({}); setSel(new Set()); return; }
    let dead=false;
    (async()=>{
      setLoading(true); setErr(null);
      try{
        const fd=new FormData(); fd.append("file",doc.file);
        const res=await fetch("/api/pages",{method:"POST",body:fd});
        if(!res.ok) throw await errorFromResponse(res);
        const data=await res.json();
        if(dead) return;
        const tm={}; data.pages.forEach(p=>tm[p.i]=p.thumb);
        setThumbs(tm);
        setPages(data.pages.map(p=>({id:"p"+p.i, orig:p.i, rot:0})));
        setSel(new Set());
      }catch(e){ if(!dead) setErr(describeError(e)); }
      finally{ if(!dead) setLoading(false); }
    })();
    return ()=>{ dead=true; };
  },[doc&&doc.file]);

  const rotate=(id,d)=>setPages(ps=>ps.map(p=>p.id===id?{...p,rot:(p.rot+d+360)%360}:p));
  const del=(id)=>{ setPages(ps=>ps.filter(p=>p.id!==id)); setSel(s=>{const n=new Set(s);n.delete(id);return n;}); };
  const toggleSel=(id)=>setSel(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;});
  const rotateSel=(d)=>setPages(ps=>ps.map(p=>sel.has(p.id)?{...p,rot:(p.rot+d+360)%360}:p));
  const delSel=()=>{ setPages(ps=>ps.filter(p=>!sel.has(p.id))); setSel(new Set()); };

  const onDrop=(id)=>{
    const from=dragId.current; dragId.current=null;
    if(!from||from===id) return;
    setPages(ps=>{
      const a=[...ps]; const fi=a.findIndex(p=>p.id===from); const ti=a.findIndex(p=>p.id===id);
      if(fi<0||ti<0) return ps;
      const [m]=a.splice(fi,1); a.splice(ti,0,m); return a;
    });
  };

  const apply=useCallback(async()=>{
    if(!pages||pages.length===0){ setErr("Keep at least one page."); return; }
    setBusy(true); setErr(null);
    try{
      const ops=pages.map(p=>({index:p.orig, rotate:p.rot}));
      const fd=new FormData(); fd.append("file",doc.file); fd.append("ops",JSON.stringify(ops));
      const res=await fetch("/api/organize",{method:"POST",body:fd});
      if(!res.ok) throw await errorFromResponse(res);
      const blob=await res.blob();
      applyResult(blob,["organized"]);   // new working doc; effect re-renders thumbs
    }catch(e){ setErr(describeError(e)); }
    finally{ setBusy(false); }
  },[pages,doc,applyResult]);

  if(!doc)
    return <div className="card">
      <Drop busy={false} label="Drag & drop a PDF to organize" sub="or click to choose a file"
        accept="application/pdf" multiple={false} onFiles={pick}/>
    </div>;

  return (
    <div className="card">
      <DocBar doc={doc} onDownload={download} onClear={clear} busy={busy}/>
      <div className="orgbar">
        <span className="orgcount">{pages?pages.length:0} pages{sel.size?` · ${sel.size} selected`:""}</span>
        <div className="orgacts">
          <button className="btn ghost" onClick={()=>rotateSel(-90)} disabled={!sel.size}><Icon name="rotL"/> Left</button>
          <button className="btn ghost" onClick={()=>rotateSel(90)} disabled={!sel.size}><Icon name="rotR"/> Right</button>
          <button className="btn ghost" onClick={delSel} disabled={!sel.size}><Icon name="trash"/> Delete</button>
          <button className="btn" onClick={apply} disabled={busy||!pages||!pages.length}>{busy?"Applying…":"Apply changes"}</button>
        </div>
      </div>
      <div className="hint">Drag a page to reorder · click to select (bulk rotate/delete) · use the buttons on each page.</div>
      {err && <div className="result"><div className="banner err">⚠ {err}</div></div>}
      {loading
        ? <div className="hint" style={{marginTop:18}}>Rendering page thumbnails…</div>
        : <div className="pagegrid">
            {pages&&pages.map((p,idx)=>(
              <div key={p.id} className={"pagecell"+(sel.has(p.id)?" sel":"")}
                draggable onDragStart={()=>dragId.current=p.id}
                onDragOver={e=>e.preventDefault()} onDrop={()=>onDrop(p.id)}
                onClick={()=>toggleSel(p.id)}>
                <div className="pagethumbwrap">
                  <img className="pagethumb" src={thumbs[p.orig]} alt={"page "+(idx+1)}
                    style={{transform:`rotate(${p.rot}deg)`}}/>
                </div>
                <div className="pagefoot">
                  <span className="pagenum">{idx+1}</span>
                  <span className="pageacts">
                    <button title="Rotate left" onClick={e=>{e.stopPropagation();rotate(p.id,-90);}}><Icon name="rotL"/></button>
                    <button title="Rotate right" onClick={e=>{e.stopPropagation();rotate(p.id,90);}}><Icon name="rotR"/></button>
                    <button title="Delete page" onClick={e=>{e.stopPropagation();del(p.id);}}><Icon name="trash"/></button>
                  </span>
                </div>
              </div>
            ))}
          </div>}
    </div>
  );
}

function App(){
  const [theme,setTheme]=useTheme();
  const [tab,setTab]=useState("deskew");            // which panel is viewed
  const [ops,setOps]=useState({deskew:true,compress:false}); // pipeline selection
  const [doc,setDoc]=useState(null);                // {file, baseName, steps:[]}
  const url=usePdfUrl(doc&&doc.file);
  // per-operation options (persist across tab views)
  const [mode,setMode]=useState("hybrid");
  const [dir,setDir]=useState("odd-neg");
  const [dpi,setDpi]=useState("110");
  const [qc,setQc]=useState("52");
  const [qg,setQg]=useState("45");
  const [colorMode,setColorMode]=useState("force_color");
  // run state
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const [report,setReport]=useState(null);

  const loadFile=useCallback((f)=>{
    setDoc({file:f, baseName:f.name.replace(/\.pdf$/i,""), steps:[]});
  },[]);
  const applyResult=useCallback((blob,addedSteps)=>{
    setDoc(prev=>{
      const base=prev?prev.baseName:"output";
      const steps=[...(prev?prev.steps:[]),...addedSteps];
      return {file:new File([blob],base+"_"+steps.join("_")+".pdf",{type:"application/pdf"}),
              baseName:base, steps};
    });
  },[]);
  const setResultDoc=useCallback((blob,baseName,steps)=>{
    const name=baseName+(steps.length?"_"+steps.join("_"):"")+".pdf";
    setDoc({file:new File([blob],name,{type:"application/pdf"}), baseName, steps});
  },[]);
  const download=useCallback(()=>{
    if(!doc)return;
    const name=doc.baseName+(doc.steps.length?"_"+doc.steps.join("_"):"")+".pdf";
    const u=URL.createObjectURL(doc.file);
    const a=document.createElement("a");a.href=u;a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(u),15000);
  },[doc]);

  const pick=useCallback((files)=>{
    const f=files[0]; setErr(null); setReport(null);
    if(!f) return;
    if(!f.name.toLowerCase().endsWith(".pdf")){setErr("That's not a PDF.");return;}
    loadFile(f);
  },[loadFile]);
  const toggleOp=useCallback((id)=>setOps(o=>({...o,[id]:!o[id]})),[]);

  // Run every selected operation, in pipeline order, in one /api/process call.
  const run=useCallback(async ()=>{
    setErr(null); setReport(null);
    if(!doc){setErr("Load a PDF first.");return;}
    if(!ops.deskew && !ops.compress){setErr("Tick at least one operation in the tab bar.");return;}
    setBusy(true);
    try{
      const fd=new FormData();
      fd.append("file",doc.file);
      fd.append("deskew",ops.deskew); fd.append("compress",ops.compress);
      if(ops.deskew){
        const [odd,even]=dir==="odd-neg"?[-1,1]:[1,-1];
        fd.append("mode",mode); fd.append("odd_sign",odd); fd.append("even_sign",even);
      }
      if(ops.compress){
        fd.append("dpi",dpi||"110"); fd.append("quality_color",qc||"52");
        fd.append("quality_gray",qg||"45"); fd.append("color_mode",colorMode);
      }
      const res=await fetch("/api/process",{method:"POST",body:fd});
      if(!res.ok) throw await errorFromResponse(res);
      const rep=JSON.parse(res.headers.get("X-Report")||"{}");
      const blob=await res.blob();
      applyResult(blob, rep.steps||[]);
      setReport(rep);
    }catch(e){setErr(describeError(e));}
    finally{setBusy(false);}
  },[doc,ops,mode,dir,dpi,qc,qg,colorMode,applyResult]);

  return (
    <div className="wrap">
      <div className="head">
        <div className="brand">
          <Logo/>
          <div>
            <h1>PDF Bench</h1>
            <p className="sub">A local toolbox to deskew, compress and merge your PDFs.</p>
          </div>
        </div>
        <button className="iconbtn" title={theme==="dark"?"Switch to light mode":"Switch to dark mode"}
          onClick={()=>setTheme(theme==="dark"?"light":"dark")}>
          <Icon name={theme==="dark"?"sun":"moon"} size={18}/>
        </button>
      </div>
      <div className="tabs">
        <OpTab id="deskew" label="Deskew" icon="deskew" active={tab==="deskew"} checked={ops.deskew} onView={setTab} onToggle={toggleOp}/>
        <OpTab id="compress" label="Compress" icon="compress" active={tab==="compress"} checked={ops.compress} onView={setTab} onToggle={toggleOp}/>
        <NavTab id="merge" label="Merge" icon="merge" active={tab==="merge"} onView={setTab}/>
        <NavTab id="organize" label="Organize" icon="organize" active={tab==="organize"} onView={setTab}/>
        <div className="tabspacer"></div>
        <NavTab id="history" label="History" icon="history" variant="log" active={tab==="history"} onView={setTab}/>
      </div>
      {tab==="history"
        ? <HistoryTab/>
        : tab==="organize"
        ? <OrganizeTab doc={doc} pick={pick} applyResult={applyResult} download={download} clear={()=>setDoc(null)}/>
        : <div className="workspace">
            <div className="workmain">
              {(tab==="deskew"||tab==="compress")
                ? <OpPane view={tab} ops={ops} doc={doc} busy={busy} err={err} report={report}
                    onPick={pick} onRun={run} download={download} clear={()=>{setDoc(null);setReport(null);}}
                    mode={mode} setMode={setMode} dir={dir} setDir={setDir}
                    dpi={dpi} setDpi={setDpi} qc={qc} setQc={setQc} qg={qg} setQg={setQg}
                    colorMode={colorMode} setColorMode={setColorMode}/>
                : <MergeTab onResult={setResultDoc}/>}
            </div>
            <div className="workaside"><PdfViewer url={url}/></div>
          </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
